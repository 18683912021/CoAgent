# Maestro E2E — 用户中心
# 前置条件：已登录

appId: com.company.appshell

---
- launchApp

# 切换到我的 Tab
- tapOn:
    text: "我的"

# 验证个人信息显示
- assertVisible: "个人资料"
- assertVisible: "账号安全"
- assertVisible: "关于"

# 点击进入编辑资料
- tapOn:
    text: "个人资料"
- assertVisible: "编辑资料"

# 返回
- tapOn:
    text: "返回"

# 进入关于页
- scroll
- tapOn:
    text: "关于"
- assertVisible: "版本号"

# 返回
- tapOn:
    text: "返回"
